server:
  port: 8084

spring:
  application:
    name: administration-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_administration}
    username: ${DB_USER:pos}
    password: ${DB_PASSWORD:pos}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"

pos:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      ttl: 8h
      issuer: pos-system

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
