server:
  port: 8083

spring:
  application:
    name: sales-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_sales}
    username: ${DB_USER:pos}
    password: ${DB_PASSWORD:pos}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: sales-api
      auto-offset-reset: earliest
    producer:
      properties:
        max.block.ms: 5000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"

pos:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      ttl: 8h
      issuer: pos-system
  outbox:
    enabled: true
    interval-ms: 1000
  services:
    catalog-url: ${CATALOG_API_URL:http://localhost:8085}
    payment-url: ${PAYMENT_API_URL:http://localhost:8086}
  receipt:
    header: ${RECEIPT_HEADER:POS System}
    footer: ${RECEIPT_FOOTER:Thank you for shopping with us!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
