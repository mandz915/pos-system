server:
  port: 8083
  tomcat:
    max-connections: 10000
    accept-count: 500
    connection-timeout: 5s

spring:
  application:
    name: sales-api
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 200ms
      connect-timeout: 500ms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_sales}

    username: ${DB_USER:pos_app}
    password: ${DB_PASSWORD:pos_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5
      connection-timeout: 3000
  flyway:

    user: ${FLYWAY_USER:pos}
    password: ${FLYWAY_PASSWORD:pos}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    listener:
      concurrency: ${KAFKA_CONCURRENCY:3}
    consumer:
      max-poll-records: 200
      group-id: sales-api
      auto-offset-reset: earliest
    producer:
      properties:
        max.block.ms: 5000
        linger.ms: 5
        compression.type: lz4

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"

pos:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      ttl: 8h
      issuer: pos-system
  outbox:
    enabled: true
    interval-ms: 1000
  services:
    catalog-url: ${CATALOG_API_URL:http://localhost:8085}
    payment-url: ${PAYMENT_API_URL:http://localhost:8086}
  receipt:
    header: ${RECEIPT_HEADER:POS System}
    footer: ${RECEIPT_FOOTER:Thank you for shopping with us!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
