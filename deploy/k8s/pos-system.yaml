# Starting point for a Kubernetes deployment (any cloud). Review before use:
#  - replace the placeholder secrets (or use your cloud's secret manager / external-secrets)
#  - point DB_HOST / KAFKA_BOOTSTRAP at your managed PostgreSQL and Kafka
#  - replace OWNER in the image names with your GitHub user/org (images are pushed by .github/workflows/ci.yml)
apiVersion: v1
kind: Namespace
metadata:
  name: pos
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pos-config
  namespace: pos
data:
  DB_HOST: postgres.pos.svc.cluster.local
  KAFKA_BOOTSTRAP: kafka.pos.svc.cluster.local:9092
  REDIS_HOST: redis.pos.svc.cluster.local
  REDIS_PORT: "6379"
  USER_API_URL: http://user-api:8081
  INVENTORY_API_URL: http://inventory-api:8082
  SALES_API_URL: http://sales-api:8083
  ADMINISTRATION_API_URL: http://administration-api:8084
  CATALOG_API_URL: http://catalog-api:8085
  PAYMENT_API_URL: http://payment-api:8086
  CUSTOMER_API_URL: http://customer-api:8087
  PURCHASING_API_URL: http://purchasing-api:8088
  REPORTING_API_URL: http://reporting-api:8089
  NOTIFICATION_API_URL: http://notification-api:8090
---
apiVersion: v1
kind: Secret
metadata:
  name: pos-secrets
  namespace: pos
type: Opaque
stringData:
  JWT_SECRET: replace-me-with-at-least-32-random-characters
  # Owner role: runs the Flyway migrations. App role: what the services use at runtime; it MUST be a plain role
  # (no superuser, no BYPASSRLS) or tenant isolation does not apply; services refuse to start otherwise.
  DB_OWNER_USER: pos
  DB_OWNER_PASSWORD: replace-me
  DB_USER: pos_app
  DB_PASSWORD: replace-me-too
  ADMIN_PASSWORD: replace-me
  PLATFORM_PASSWORD: replace-me
  REDIS_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: pos
  labels: {app: gateway-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway-api}
  template:
    metadata:
      labels: {app: gateway-api}
    spec:
      containers:
      - name: gateway-api
        image: ghcr.io/OWNER/pos-system/gateway-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: DB_HOST
          valueFrom: {configMapKeyRef: {name: pos-config, key: DB_HOST}}
        - name: KAFKA_BOOTSTRAP
          valueFrom: {configMapKeyRef: {name: pos-config, key: KAFKA_BOOTSTRAP}}
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: pos-secrets, key: JWT_SECRET}}
        - name: REDIS_HOST
          valueFrom: {configMapKeyRef: {name: pos-config, key: REDIS_HOST}}
        - name: REDIS_PORT
          valueFrom: {configMapKeyRef: {name: pos-config, key: REDIS_PORT}}
        - name: REDIS_PASSWORD
          valueFrom: {secretKeyRef: {name: pos-secrets, key: REDIS_PASSWORD}}
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: pos-secrets, key: DB_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: pos-secrets, key: DB_PASSWORD}}
        - name: FLYWAY_USER
          valueFrom: {secretKeyRef: {name: pos-secrets, key: DB_OWNER_USER}}
        - name: FLYWAY_PASSWORD
          valueFrom: {secretKeyRef: {name: pos-secrets, key: DB_OWNER_PASSWORD}}
        - name: USER_API_URL
          valueFrom: {configMapKeyRef: {name: pos-config, key: USER_API_URL}}
        - name: INVENTORY_API_URL
          valueFrom: {configMapKeyRef: {name: pos-config, key: INVENTORY_API_URL}}
        - name: SALES_API_URL
          valueFrom: {configMapKeyRef: {name: pos-config, key: SALES_API_URL}}
        - name: ADMINISTRATION_API_URL
          valueFrom: {configMapKeyRef: {name: pos-config, key: ADMINISTRATION_API_URL}}
        - name: CATALOG_API_URL
          valueFrom: {configMapKeyRef: {name: pos-config, key: CATALOG_API_URL}}
        - name: PAYMENT_API_URL
          valueFrom: {configMapKeyRef: {name: pos-config, key: PAYMENT_API_URL}}
        - name: CUSTOMER_API_URL
          valueFrom: {configMapKeyRef: {name: pos-config, key: CUSTOMER_API_URL}}
        - name: PURCHASING_API_URL
          valueFrom: {configMapKeyRef: {name: pos-config, key: PURCHASING_API_URL}}
        - name: REPORTING_API_URL
          valueFrom: {configMapKeyRef: {name: pos-config, key: REPORTING_API_URL}}
        - name: NOTIFICATION_API_URL
          valueFrom: {configMapKeyRef: {name: pos-config, key: NOTIFICATION_API_URL}}
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8080}
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          initialDelaySeconds: 40
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 384Mi}
          limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: pos
spec:
  selector: {app: gateway-api}
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  namespace: pos
  labels: {app: user-api}
spec:
