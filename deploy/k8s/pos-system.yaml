        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: pos-secrets, key: JWT_SECRET}}
        - name: REDIS_HOST
          valueFrom: {configMapKeyRef: {name: pos-config, key: REDIS_HOST}}
        - name: REDIS_PORT
          valueFrom: {configMapKeyRef: {name: pos-config, key: REDIS_PORT}}
        - name: REDIS_PASSWORD
          valueFrom: {secretKeyRef: {name: pos-secrets, key: REDIS_PASSWORD}}
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: pos-secrets, key: DB_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: pos-secrets, key: DB_PASSWORD}}
        - name: FLYWAY_USER
          valueFrom: {secretKeyRef: {name: pos-secrets, key: DB_OWNER_USER}}
        - name: FLYWAY_PASSWORD
          valueFrom: {secretKeyRef: {name: pos-secrets, key: DB_OWNER_PASSWORD}}
        - name: DB_URL
          value: jdbc:postgresql://$(DB_HOST):5432/pos_user
        - name: ADMIN_PASSWORD
          valueFrom: {secretKeyRef: {name: pos-secrets, key: ADMIN_PASSWORD}}
        - name: PLATFORM_PASSWORD
          valueFrom: {secretKeyRef: {name: pos-secrets, key: PLATFORM_PASSWORD}}
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8081}
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8081}
          initialDelaySeconds: 40
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 384Mi}
          limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: user-api
  namespace: pos
spec:
  selector: {app: user-api}
  ports:
  - port: 8081
    targetPort: 8081
