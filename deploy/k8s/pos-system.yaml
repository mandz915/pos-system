---
# Single-node Redis for development. It holds only disposable data (caches, rate-limit counters, the token blocklist),
# but in production use a managed Redis with replication (ElastiCache, Memorystore, Azure Cache) and set REDIS_HOST,
# REDIS_PASSWORD and REDIS_SSL accordingly: a restart of this pod clears the blocklist, so logged-out tokens would work
# again until they expire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pos
  labels: {app: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "no"]
        ports:
        - containerPort: 6379
        readinessProbe:
          exec: {command: ["redis-cli", "ping"]}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 320Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pos
spec:
  selector: {app: redis}
  ports:
  - port: 6379
    targetPort: 6379

