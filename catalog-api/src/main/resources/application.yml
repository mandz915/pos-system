server:
  port: 8085
  tomcat:
    max-connections: 10000
    accept-count: 500
    connection-timeout: 5s

spring:
  application:
    name: catalog-api
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 200ms
      connect-timeout: 500ms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_catalog}
    # The application role must be a plain one (no superuser, no BYPASSRLS) or tenant isolation does not apply.
    username: ${DB_USER:pos_app}
    password: ${DB_PASSWORD:pos_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5
      connection-timeout: 3000
  flyway:
    # Migrations run as the table owner, the application as a plain role (see scripts/init-databases.sh).
    user: ${FLYWAY_USER:pos}
    password: ${FLYWAY_PASSWORD:pos}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"

pos:
  cache:
    catalog-ttl: ${CATALOG_CACHE_TTL:30s}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      ttl: 8h
      issuer: pos-system

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
