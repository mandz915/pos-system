server:
  port: 8081
  tomcat:
    max-connections: 10000
    accept-count: 500
    connection-timeout: 5s

spring:
  application:
    name: user-api
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 200ms
      connect-timeout: 500ms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_user}
    # The application role must be a plain one (no superuser, no BYPASSRLS) or tenant isolation does not apply.
    username: ${DB_USER:pos_app}
    password: ${DB_PASSWORD:pos_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5
      connection-timeout: 3000
  flyway:
    # Migrations run as the table owner, the application as a plain role (see scripts/init-databases.sh).
    user: ${FLYWAY_USER:pos}
    password: ${FLYWAY_PASSWORD:pos}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"

pos:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      ttl: 8h
      issuer: pos-system
    public-paths: /api/auth/login,/api/auth/pin-login
  bootstrap:
    platform-username: ${PLATFORM_USERNAME:platform}
    platform-password: ${PLATFORM_PASSWORD:Platform#12345}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:Admin#12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
