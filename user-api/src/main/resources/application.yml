server:
  port: 8081

spring:
  application:
    name: user-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_user}
    username: ${DB_USER:pos}
    password: ${DB_PASSWORD:pos}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"

pos:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      ttl: 8h
      issuer: pos-system
    public-paths: /api/auth/login,/api/auth/pin-login
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:Admin#12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
